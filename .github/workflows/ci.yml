name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Smart Contracts ───────────────────────────────────
  forge-test:
    name: Foundry Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aegis/contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Compile contracts
        run: forge build

      - name: Run unit & fuzz tests
        run: forge test --no-match-contract Fork -vv
        env:
          RPC_URL: ${{ secrets.COSTON2_RPC_URL }}

      - name: Run fork tests
        if: ${{ secrets.COSTON2_RPC_URL != '' }}
        run: forge test --match-contract Fork -vv
        env:
          RPC_URL: ${{ secrets.COSTON2_RPC_URL }}

  # ─── Frontend ──────────────────────────────────────────
  frontend:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: ESLint
        run: npx eslint src/

      - name: Production build
        run: npx next build

  # ─── Security ──────────────────────────────────────────
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for private keys
        run: |
          # Scan for 64-char hex strings that could be private keys
          # Exclude known non-secret patterns (event topics, contract addresses, tx hashes)
          if grep -rPn '(?:^|\s|["'\''`])(0x)?[0-9a-fA-F]{64}(?:\s|["'\''`]|,|$)' \
            --include='*.ts' --include='*.tsx' --include='*.js' \
            frontend/src/ aegis/contracts/src/ 2>/dev/null | \
            grep -viE '(topic|hash|merkle|SIMULATED|0x0000|constant|event)'; then
            echo "⚠️  Potential private keys found — review manually"
            exit 1
          else
            echo "✅ No private keys detected"
          fi
